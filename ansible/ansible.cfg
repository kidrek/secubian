# Réglages d'Ansible pour Secubian (à mettre à côté de secubian.yml)
[defaults]
# Plus besoin de taper "-i inventory" à chaque fois
inventory = inventory
# Cache les avertissements "deprecated" qui noient les vraies erreurs
deprecation_warnings = False
# Pas de fichiers ".retry" qui traînent partout
retry_files_enabled = False
# Affiche la durée de chaque tâche à la fin (pratique pour voir ce qui est long)
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# Plus rapide, et évite des soucis de droits quand on passe de root à ton user
pipelining = True
