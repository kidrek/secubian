# =====================================================================
# PORTAINER : une interface web pour gérer Docker
# Accès : https://127.0.0.1:9443
# Identifiant : admin  (le mdp dans KeePassXC, entrée "portainer")
# =====================================================================

# Changement entre l'ancienne version et la nouvelle:
# Depuis Portainer 2.43 (faille CVE-2026-55761), on ne peut plus créer l'admin
# via l'API sans un "jeton de setup" caché dans les logs -> erreur 403.
# Le nouveau moyen maintenant : donner le mot de passe à Portainer dès son
# démarrage (--admin-password-file). Il crée l'admin "admin" tout seul.
# Avec "-H unix:///var/run/docker.sock" il se branche tout seul sur le Docker local.
# Résultat : Donc plus besoin d'API

- name: "Portainer | Créer le volume pour garder les données"
  community.docker.docker_volume:
    name: portainer_data

# Le mot de passe existe déjà dans KeePassXC ?
- name: "Portainer | Mot de passe déjà dans KeePassXC ?"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: >-
    printf '%s\n' {{ keepass_db_password | quote }}
    | keepassxc-cli show -q -a password {{ keepass_db_path | quote }} portainer
  delegate_to: localhost
  register: portainer_keepass_entry
  changed_when: false
  failed_when: false
  no_log: true

# Pas encore de mot de passe : on en génère un et on le range dans KeePassXC
- name: "Portainer | Première fois : nouveau mot de passe"
  when: portainer_keepass_entry.rc != 0
  block:
    - name: "Portainer | Générer un mot de passe"
      ansible.builtin.include_tasks: tasks/keepassXC_generate_password.yml

    - name: "Portainer | Ranger le mot de passe dans KeePassXC"
      become_user: "{{ ansible_user }}"
      ansible.builtin.shell: >-
        printf '%s\n%s\n' {{ keepass_db_password | quote }} {{ password | quote }}
        | keepassxc-cli add --url 'https://127.0.0.1:9443/' -u admin -p {{ keepass_db_path | quote }} portainer
      delegate_to: localhost
      no_log: true

# Déjà un mot de passe : on le reprend tel quel
- name: "Portainer | Reprendre le mot de passe de KeePassXC"
  ansible.builtin.set_fact:
    password: "{{ portainer_keepass_entry.stdout | trim }}"
  when: portainer_keepass_entry.rc == 0
  no_log: true

# Le fichier que Portainer lit au démarrage. 0600 + root = personne d'autre peut le lire.
- name: "Portainer | Dossier pour le fichier du mot de passe"
  ansible.builtin.file:
    path: /etc/portainer
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Portainer | Écrire le mot de passe admin"
  ansible.builtin.copy:
    dest: /etc/portainer/admin_password
    content: "{{ password }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "Portainer | Lancer le conteneur"
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce
    state: started
    restart_policy: always
    command:
      - "--admin-password-file"
      - "/run/portainer/admin_password"
      - "-H"
      - "unix:///var/run/docker.sock"
    volumes:
      - "portainer_data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/etc/portainer/admin_password:/run/portainer/admin_password:ro"
    # "127.0.0.1:" = accessible seulement depuis ton PC
    ports:
      - "127.0.0.1:9000:8000"
      - "127.0.0.1:9443:9443"

- name: "Portainer | Attendre que Portainer réponde"
  ansible.builtin.uri:
    url: https://127.0.0.1:9443
    validate_certs: false
  register: portainer_up
  until: portainer_up.status == 200
  retries: 10
  delay: 10

# On teste la connexion avec admin + le mot de passe, pour être sûr que tout est bon
- name: "Portainer | Tester la connexion"
  ansible.builtin.uri:
    url: "https://127.0.0.1:9443/api/auth"
    validate_certs: false
    method: POST
    body_format: json
    body:
      Username: admin
      Password: "{{ password }}"
    status_code: [200, 401, 422]
  register: portainer_auth
  no_log: true

# Si ça marche pas, c'est qu'un ancien admin existe déjà avec un autre mot de passe
- name: "Portainer | Prévenir si la connexion échoue"
  ansible.builtin.fail:
    msg: >-
      Impossible de se connecter à Portainer avec admin + le mot de passe de KeePassXC.
      Un ancien admin existe sûrement avec un autre mot de passe. Pour repartir de zéro :
      sudo docker rm -f portainer && sudo docker volume rm portainer_data
      puis relance le playbook.
  when: portainer_auth.status != 200