# =====================================================================
# BLACKBIRD : cherche un pseudo ou un mail sur des centaines de sites
# (réseaux sociaux, forums...) pour voir où la personne a un compte.
#
# Avant, le playbook restait bloqué ici pour toujours : "pyenv install 3.9.18"
# demandait "déjà installé, on continue ? (y/N)" et attendait une réponse.
# Maintenant Blackbird a son propre environnement Python (~/.venvs/blackbird)
# avec le Python d'Ubuntu, plus besoin de pyenv.
# =====================================================================

- name: "Blackbird | Chemins utiles"
  ansible.builtin.set_fact:
    blackbird_dir: "{{ OSINT_toolsDir }}/blackbird"
    blackbird_venv: "/home/{{ ansible_user }}/.venvs/blackbird"

- name: "Blackbird | Installer les prérequis"
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
    state: present

- name: "Blackbird | Télécharger Blackbird"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/p1ngul1n0/blackbird
    dest: "{{ blackbird_dir }}"
    accept_hostkey: true
    force: true

# Le module pip crée l'environnement tout seul s'il existe pas
- name: "Blackbird | Installer les modules Python"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    requirements: "{{ blackbird_dir }}/requirements.txt"
    virtualenv: "{{ blackbird_venv }}"
    virtualenv_command: python3 -m venv

# Raccourci : tape "blackbird.py -u pseudo" pour chercher un pseudo.
# On va dans son dossier d'abord, Blackbird y range ses listes de sites et ses résultats.
- name: "Blackbird | Ajouter l'alias"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias blackbird.py='cd {{ blackbird_dir }} && {{ blackbird_venv }}/bin/python blackbird.py'"
    regexp: "^alias blackbird.py="