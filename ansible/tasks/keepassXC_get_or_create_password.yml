# =====================================================================
# KEEPASSXC : donne un mot de passe pour un outil
# - S'il est déjà dans KeePassXC, on reprend le même.
# - Sinon, on en crée un nouveau et on le range dedans.
# Comme ça, relancer le playbook casse plus rien.
#
# Pour l'utiliser dans un autre fichier :
#   - ansible.builtin.include_tasks: tasks/keepassXC_get_or_create_password.yml
#     vars:
#       keepass_entry: "iris"                     # nom dans KeePassXC
#       keepass_url: "https://127.0.0.1:7443/"    # adresse de l'outil
#       keepass_username: "secubian"              # identifiant
#
# Ce que ça donne à la fin :
#   - password             = le mot de passe
#   - keepass_entry_is_new = true si on vient de le créer
# =====================================================================

# On regarde si le mot de passe est déjà dans KeePassXC
# (no_log = il s'affiche pas dans les logs)
- name: "Keepass | Le mot de passe '{{ keepass_entry }}' existe déjà ?"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: >-
    printf '%s\n' {{ keepass_db_password | quote }}
    | keepassxc-cli show -q -a password {{ keepass_db_path | quote }} {{ keepass_entry | quote }}
  delegate_to: localhost
  register: keepass_existing
  changed_when: false
  failed_when: false
  no_log: true

# Il est là : on le garde
- name: "Keepass | Reprendre le mot de passe '{{ keepass_entry }}'"
  ansible.builtin.set_fact:
    password: "{{ keepass_existing.stdout | trim }}"
    keepass_entry_is_new: false
  when: keepass_existing.rc == 0
  no_log: true

# Il est pas là : on en crée un et on le range
- name: "Keepass | Créer le mot de passe '{{ keepass_entry }}'"
  when: keepass_existing.rc != 0
  block:
    - name: "Keepass | Générer un mot de passe"
      ansible.builtin.include_tasks: tasks/keepassXC_generate_password.yml

    - name: "Keepass | Ranger '{{ keepass_entry }}' dans KeePassXC"
      become_user: "{{ ansible_user }}"
      ansible.builtin.shell: >-
        printf '%s\n%s\n' {{ keepass_db_password | quote }} {{ password | quote }}
        | keepassxc-cli add --url {{ keepass_url | quote }} -u {{ keepass_username | quote }}
        -p {{ keepass_db_path | quote }} {{ keepass_entry | quote }}
      delegate_to: localhost
      no_log: true

    - name: "Keepass | Noter que c'est un nouveau mot de passe"
      ansible.builtin.set_fact:
        keepass_entry_is_new: true