# =====================================================================
# WIKI SPHINX : génère le wiki Secubian en pages web et le sert avec nginx
# Accès : http://127.0.0.1/wiki
# Source : https://sphinx-inline-tabs.readthedocs.io/en/latest/
# =====================================================================

# On repart de zéro à chaque fois pour avoir un wiki propre
- name: "Wiki | Supprimer l'ancien wiki"
  ansible.builtin.file:
    path: "{{ documentationDir }}/wiki"
    state: absent

- name: "Wiki | Installer nginx (le serveur web)"
  ansible.builtin.apt:
    name: nginx
    state: present

- name: "Wiki | Démarrer nginx"
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: "Wiki | Créer le dossier du wiki"
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ documentationDir }}/wiki"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0775"

# Le module pip crée l'environnement virtuel (__env__) tout seul s'il existe pas,
# plus besoin de le faire à la main avec un shell
- name: "Wiki | Installer Sphinx, ses extensions et ses thèmes"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    name:
      - sphinx
      - myst-parser
      - sphinx-inline-tabs
      - furo
      - sphinx-rtd-theme
      - sphinx-book-theme
    virtualenv: "{{ documentationDir }}/wiki/__env__"
    virtualenv_command: python3 -m venv

# On appelle directement le sphinx-quickstart de l'environnement virtuel,
# pas besoin de faire "source activate" avant
- name: "Wiki | Créer le projet Sphinx"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: >-
    {{ documentationDir }}/wiki/__env__/bin/sphinx-quickstart -q --sep
    -p wiki -a kidrek -v 0.1 --ext-autodoc
  args:
    chdir: "{{ documentationDir }}/wiki"
    creates: "{{ documentationDir }}/wiki/source/conf.py"

- name: "Wiki | Choisir le thème"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ documentationDir }}/wiki/source/conf.py"
    line: "html_theme = 'sphinx_book_theme'"
    regexp: "^html_theme ="

- name: "Wiki | Activer les extensions dans la config"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "{{ documentationDir }}/wiki/source/conf.py"
    regexp: '^    "{{ item }}",'
    insertafter: '^extensions = \['
    line: '    "{{ item }}",'
  loop:
    - myst_parser
    - sphinx_inline_tabs

# On télécharge le contenu du wiki dans /tmp (on vide d'abord au cas où un vieux
# téléchargement traîne, sinon git peut râler)
- name: "Wiki | Nettoyer /tmp/wiki"
  ansible.builtin.file:
    path: /tmp/wiki
    state: absent

- name: "Wiki | Télécharger le wiki Secubian"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/kidrek/secubian-wiki.git
    dest: /tmp/wiki
    accept_hostkey: true
    recursive: true

# Avant c'était "mv /tmp/wiki/.*", qui essayait aussi de déplacer "." et ".."
# et plantait (d'où le ignore_errors). "copy" fait ça proprement, fichiers cachés compris.
- name: "Wiki | Mettre le contenu dans le projet Sphinx"
  become_user: "{{ ansible_user }}"
  ansible.builtin.copy:
    src: /tmp/wiki/
    dest: "{{ documentationDir }}/wiki/source/"
    remote_src: true

- name: "Wiki | Supprimer le téléchargement"
  ansible.builtin.file:
    path: /tmp/wiki
    state: absent

# On génère les pages HTML avec le sphinx de l'environnement virtuel
- name: "Wiki | Générer les pages HTML"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "make html SPHINXBUILD={{ documentationDir }}/wiki/__env__/bin/sphinx-build"
  args:
    chdir: "{{ documentationDir }}/wiki"

# Avant, si /var/www/html/wiki existait déjà, "cp -r" mettait le nouveau wiki
# DANS l'ancien (/var/www/html/wiki/html). Là on vire l'ancien d'abord.
- name: "Wiki | Supprimer l'ancienne version en ligne"
  ansible.builtin.file:
    path: /var/www/html/wiki
    state: absent

# www-data = le user de nginx. Il peut lire, personne d'autre ne peut modifier.
- name: "Wiki | Mettre le wiki en ligne"
  ansible.builtin.copy:
    src: "{{ documentationDir }}/wiki/build/html/"
    dest: /var/www/html/wiki/
    remote_src: true
    owner: www-data
    group: www-data
    mode: "0400"
    directory_mode: "0500"

# Raccourci pour mettre le wiki à jour : tape "update-wiki"
- name: "Wiki | Ajouter l'alias de mise à jour"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias update-wiki='cd {{ documentationDir }}/wiki/source && git pull && cd {{ documentationDir }}/wiki && make html SPHINXBUILD={{ documentationDir }}/wiki/__env__/bin/sphinx-build && sudo rm -rf /var/www/html/wiki && sudo cp -rf ./build/html /var/www/html/wiki && sudo chown -R www-data:www-data /var/www/html/wiki; cd -'"
    regexp: "^alias update-wiki="
