# =====================================================================
# PYENV : permet d'avoir plusieurs versions de Python sur le même PC
# sans toucher au Python du système (qui sert à Ubuntu lui-même)
# =====================================================================

# Tout ce qu'il faut pour compiler Python
# (libzstd-dev : nécessaire depuis Python 3.14)
- name: "PyEnv | Installer les outils pour compiler Python"
  ansible.builtin.apt:
    name:
      - build-essential
      - libssl-dev
      - zlib1g-dev
      - libbz2-dev
      - libreadline-dev
      - libsqlite3-dev
      - wget
      - curl
      - llvm
      - libncurses5-dev
      - libncursesw5-dev
      - xz-utils
      - tk-dev
      - libffi-dev
      - liblzma-dev
      - libzstd-dev
      - python3-openssl
      - git
    state: present

- name: "PyEnv | Pyenv est déjà installé ?"
  become_user: "{{ ansible_user }}"
  ansible.builtin.stat:
    path: "/home/{{ ansible_user }}/.pyenv"
  register: pyEnvFile

- name: "PyEnv | Installer pyenv"
  become_user: "{{ ansible_user }}"
  ansible.builtin.shell: curl -fsSL https://pyenv.run | bash
  when: not pyEnvFile.stat.exists

# Les lignes pour que ton terminal trouve pyenv (fichier ~/.env, lu par zsh)
- name: "PyEnv | Ajouter pyenv dans ~/.env"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.env"
    line: "{{ item }}"
    insertbefore: EOF
    create: true
    mode: "0644"
  loop:
    - '## PYENV'
    - 'export PYENV_ROOT="$HOME/.pyenv"'
    - 'command -v pyenv >/dev/null || export PATH="$PYENV_ROOT/bin:$PATH"'
    - 'eval "$(pyenv init -)"'
    - 'eval "$(pyenv virtualenv-init -)"'
  when: not pyEnvFile.stat.exists

# pyenv connaît une version de Python seulement si sa liste est à jour.
# Sans ça il verrait jamais les nouvelles versions.
- name: "PyEnv | Mettre pyenv à jour"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/pyenv/pyenv.git
    dest: "/home/{{ ansible_user }}/.pyenv"
    update: true

# On demande à pyenv quelle est la dernière version stable de Python 3
- name: "PyEnv | Trouver la dernière version de Python 3"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "/home/{{ ansible_user }}/.pyenv/bin/pyenv latest -k 3"
  register: python_latest
  changed_when: false

# On vérifie que c'est bien une version normale (ex : 3.15.0) et pas une version
# de test (3.16.0a1) ou spéciale (3.15.0t). Sinon on s'arrête avec un message clair.
- name: "PyEnv | Vérifier la version trouvée"
  ansible.builtin.assert:
    that: python_latest.stdout is match('^3\.[0-9]+\.[0-9]+$')
    fail_msg: "pyenv a trouvé '{{ python_latest.stdout }}', c'est pas une version stable normale."
    success_msg: "Dernière version de Python : {{ python_latest.stdout }}"

# "--skip-existing" : si une version est déjà installée, on la recompile pas (ça prend des plombes)
- name: "PyEnv | Installer les versions de Python"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "/home/{{ ansible_user }}/.pyenv/bin/pyenv install --skip-existing {{ item }}"
  loop:
    - "2.7.18"
    - "3.8.18"
    - "3.9.18"
    - "{{ python_latest.stdout }}"
  register: pyenv_install
  changed_when: "'Installed' in (pyenv_install.stdout + pyenv_install.stderr)"

- name: "PyEnv | Ajouter les versions au PATH dans ~/.env"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.env"
    line: "export PATH=/home/{{ ansible_user }}/.pyenv/versions/{{ item }}/bin:$PATH"
    insertbefore: EOF
    create: true
    mode: "0644"
  loop:
    - "2.7.18"
    - "3.8.18"
    - "3.9.18"
  when: not pyEnvFile.stat.exists

# "python" = 3.9.18 (pour pas casser tes outils existants)
# "python3.15" (ou la dernière) est aussi dispo directement
- name: "PyEnv | Versions par défaut (3.9.18 + la dernière)"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "/home/{{ ansible_user }}/.pyenv/bin/pyenv global 3.9.18 {{ python_latest.stdout }}"
  changed_when: false
