# =====================================================================
# VOLATILITY 3 : la version moderne de Volatility (analyse de RAM), en Python 3
# =====================================================================

- name: "Volatility3 | Chemins utiles"
  ansible.builtin.set_fact:
    vol3_pip: "/home/{{ ansible_user }}/.pyenv/versions/3.9.18/bin/pip"
    vol3_symbols: "/home/{{ ansible_user }}/.pyenv/versions/3.9.18/lib/python3.9/site-packages/volatility3/symbols"

# Avant on passait "$HOME" à Ansible, mais il le remplace pas toujours par ton vrai dossier.
- name: "Volatility3 | Installer Volatility 3"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    name:
      - volatility3
      - capstone
    executable: "{{ vol3_pip }}"

# ---------------------------------------------------------------------
# Les "tables de symboles" : sans elles, Volatility comprend pas la mémoire
# d'une version de Windows donnée.
# ---------------------------------------------------------------------

# Celles du JP-CERT. "depth: 1" = juste la dernière version, beaucoup plus léger.
- name: "Volatility3 | Télécharger les symboles Windows du JP-CERT"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/JPCERTCC/Windows-Symbol-Tables
    dest: "{{ DFIR_toolsDir }}/volatility3-Windows_symbol_tables"
    accept_hostkey: true
    force: true
    depth: 1

# Avant c'était un "mv" en shell avec "$HOME". "copy" fait pareil proprement.
- name: "Volatility3 | Copier les symboles JP-CERT dans Volatility"
  become_user: "{{ ansible_user }}"
  ansible.builtin.copy:
    src: "{{ DFIR_toolsDir }}/volatility3-Windows_symbol_tables/symbols/windows/"
    dest: "{{ vol3_symbols }}/windows/"
    remote_src: true

- name: "Volatility3 | Supprimer le téléchargement JP-CERT"
  ansible.builtin.file:
    path: "{{ DFIR_toolsDir }}/volatility3-Windows_symbol_tables"
    state: absent

# Les packs officiels. Volatility 3 sait lire les .zip directement,
# pas besoin de les décompresser. Et get_url les retélécharge pas s'ils sont déjà là
# (avant, plusieurs centaines de Mo étaient retéléchargés à chaque lancement).
- name: "Volatility3 | Télécharger les packs de symboles officiels"
  become_user: "{{ ansible_user }}"
  ansible.builtin.get_url:
    url: "https://downloads.volatilityfoundation.org/volatility3/symbols/{{ item }}.zip"
    dest: "{{ vol3_symbols }}/{{ item }}.zip"
    mode: "0644"
    timeout: 1800
  loop:
    - windows
    - linux
    - mac

# Raccourci : "volatility3" = "vol"
- name: "Volatility3 | Ajouter l'alias"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias volatility3='vol'"
    regexp: "^alias volatility3="
