# =====================================================================
# VOLATILITY 2 : analyse de la RAM (dumps mémoire). C'est l'ancienne version,
# en Python 2.7, mais plein de plugins existent que pour elle.
# =====================================================================

- name: "Volatility | Choisir la version de Python"
  ansible.builtin.set_fact:
    python_version: "2.7.18"

# "git-core" n'existe plus sur les Ubuntu récents (apt plantait dessus) : c'est "git" maintenant
- name: "Volatility | Installer les prérequis"
  ansible.builtin.apt:
    name:
      - build-essential
      - capstone-tool
      - clamav
      - git
      - libcapstone-dev
      - libraw1394-11
      - libssl-dev
      - tzdata
      - yara
    state: present

# Avant on passait "$HOME" à Ansible, mais il le remplace pas toujours par ton vrai dossier.
# Là on donne directement le pip du Python 2.7.18 de pyenv.
# (pip choisit tout seul les dernières versions qui marchent encore en Python 2)
- name: "Volatility | Installer les modules Python"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    name:
      - construct
      - distorm3
      - future
      - openpyxl
      - pdbparse
      - pefile
      - pillow
      - pycrypto
      - pycryptodome
      - pytz
      - setuptools
      - ujson
    executable: "/home/{{ ansible_user }}/.pyenv/versions/{{ python_version }}/bin/pip"

- name: "Volatility | Télécharger Volatility"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/volatilityfoundation/volatility.git
    dest: "{{ DFIR_toolsDir }}/data_processing/volatility"
    accept_hostkey: true
    force: true

# Dans ce dossier, "python" = Python 2.7.18 (pyenv lit le fichier .python-version)
- name: "Volatility | Utiliser Python 2.7 dans son dossier"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "/home/{{ ansible_user }}/.pyenv/bin/pyenv local {{ python_version }}"
  args:
    chdir: "{{ DFIR_toolsDir }}/data_processing/volatility"
    creates: "{{ DFIR_toolsDir }}/data_processing/volatility/.python-version"

# ---------------------------------------------------------------------
# Plugins en plus
# La plupart viennent de https://github.com/sans-dfir/sift-files/tree/master/volatility
# Source : https://github.com/juju4/ansible-volatility/blob/master/tasks/volatility-modules.yml
# ---------------------------------------------------------------------
- name: "Volatility | Créer le dossier des plugins"
  become_user: "{{ ansible_user }}"
  ansible.builtin.file:
    path: "{{ DFIR_toolsDir }}/data_processing/volatility/volatilityplugins"
    state: directory
    mode: "0755"

# Avant c'était une tâche par plugin, là c'est groupé (même résultat)
- name: "Volatility | Télécharger les plugins"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ DFIR_toolsDir }}/data_processing/volatility/{{ item.dest }}"
    force: true
  loop:
    # plugins de la communauté
    - { repo: "https://github.com/volatilityfoundation/community.git", dest: "volatilityplugins/community" }
    # outils du JP-CERT (détection Cobalt Strike, etc.)
    # http://blog.jpcert.or.jp/2016/12/a-new-tool-to-d-d6bc.html
    # https://blog.jpcert.or.jp/2018/08/volatility-plugin-for-detecting-cobalt-strike-beacon.html
    - { repo: "https://github.com/JPCERTCC/aa-tools.git", dest: "aa-tools" }
    # ce qui se lance au démarrage de Windows (autoruns)
    - { repo: "https://github.com/tomchop/volatility-autoruns", dest: "volatilityplugins/volatility-autoruns" }
    # récupérer les clés BitLocker en mémoire
    - { repo: "https://github.com/elceef/bitlocker", dest: "volatilityplugins/elceef-bitlocker" }
    # extraire la config des malwares PlugX et Andromeda
    - { repo: "https://github.com/arbor-jjones/volatility_plugins.git", dest: "plugx+andromeda" }

# Raccourci : tape "vol.py" pour lancer Volatility 2
- name: "Volatility | Ajouter l'alias"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias vol.py='/home/{{ ansible_user }}/.pyenv/versions/{{ python_version }}/bin/python {{ DFIR_toolsDir }}/data_processing/volatility/vol.py'"
    regexp: "^alias vol.py="
