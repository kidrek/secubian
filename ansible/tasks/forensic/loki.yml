# =====================================================================
# LOKI : scanner d'IOC (indicateurs de compromission). Il cherche sur un disque
# des fichiers, noms ou hash connus pour être malveillants.
# =====================================================================

- name: "Loki | Choisir la version de Python"
  ansible.builtin.set_fact:
    python_version: "3.9.18"
    loki_python: "/home/{{ ansible_user }}/.pyenv/versions/3.9.18/bin/python"

- name: "Loki | Télécharger Loki"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/Neo23x0/Loki.git
    dest: "{{ DFIR_toolsDir }}/analyse/tools/Loki"
    accept_hostkey: true
    force: true
    recursive: true

# Avant on passait "$HOME" à Ansible, mais il le remplace pas toujours par ton vrai dossier.
- name: "Loki | Installer les modules Python"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    requirements: "{{ DFIR_toolsDir }}/analyse/tools/Loki/requirements.txt"
    executable: "/home/{{ ansible_user }}/.pyenv/versions/{{ python_version }}/bin/pip"

# Télécharge les dernières signatures de menaces
- name: "Loki | Mettre à jour les signatures"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "{{ loki_python }} ./loki-upgrader.py"
  args:
    chdir: "{{ DFIR_toolsDir }}/analyse/tools/Loki"

# Raccourci : tape "loki.py" pour lancer le scan
- name: "Loki | Ajouter l'alias"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: 'alias loki.py="cd {{ DFIR_toolsDir }}/analyse/tools/Loki; {{ loki_python }} loki.py"'
    regexp: "^alias loki.py="
