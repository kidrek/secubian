# =====================================================================
# ZIRCOLITE : passe les journaux Windows (.evtx) au crible des règles Sigma
# pour trouver les trucs suspects.
#
# Depuis la version 4.8, Zircolite demande Python 3.12 à 3.14 (le 3.9.18 de pyenv
# marche plus) et n'a plus de requirements.txt. On lui fait donc son propre
# environnement Python dans ~/.venvs/zircolite, avec le Python d'Ubuntu.
# =====================================================================

- name: "Zircolite | Chemins utiles"
  ansible.builtin.set_fact:
    zircolite_dir: "{{ DFIR_toolsDir }}/analyse/tools/windows_evtx/Zircolite"
    zircolite_venv: "/home/{{ ansible_user }}/.venvs/zircolite"

# python3-dev + build-essential : Zircolite compile un petit morceau en C à l'install
- name: "Zircolite | Installer les prérequis"
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-dev
      - build-essential
    state: present

# On vérifie que le Python d'Ubuntu est entre 3.12 et 3.14
- name: "Zircolite | Version du Python d'Ubuntu"
  ansible.builtin.command: python3 -c "import sys; print('%d.%d' % sys.version_info[:2])"
  register: zircolite_pyver
  changed_when: false

- name: "Zircolite | Vérifier la version de Python"
  ansible.builtin.assert:
    that:
      - zircolite_pyver.stdout is version('3.12', '>=')
      - zircolite_pyver.stdout is version('3.14', '<=')
    fail_msg: "Zircolite demande Python 3.12 à 3.14, Ubuntu a le {{ zircolite_pyver.stdout }}."
    success_msg: "Python {{ zircolite_pyver.stdout }} : OK pour Zircolite"

- name: "Zircolite | Télécharger Zircolite"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/wagga40/Zircolite.git
    dest: "{{ zircolite_dir }}"
    accept_hostkey: true
    force: true

# On installe Zircolite et tout ce dont il a besoin dans son environnement.
# Le module pip crée l'environnement tout seul s'il existe pas.
# "-e" = il utilise directement le code téléchargé (pratique pour les mises à jour)
- name: "Zircolite | Installer Zircolite et ses modules"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    name: "{{ zircolite_dir }}"
    editable: true
    virtualenv: "{{ zircolite_venv }}"
    virtualenv_command: python3 -m venv

# Télécharge les dernières règles. Si internet coupe c'est pas grave,
# Zircolite marche avec les règles déjà présentes.
- name: "Zircolite | Mettre à jour les règles"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: "{{ zircolite_venv }}/bin/python zircolite.py -U"
  args:
    chdir: "{{ zircolite_dir }}"
  ignore_errors: true

# Raccourci : tape "zircolite.py" pour lancer l'analyse
- name: "Zircolite | Ajouter l'alias"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias zircolite.py='{{ zircolite_venv }}/bin/python {{ zircolite_dir }}/zircolite.py'"
    regexp: "^alias zircolite.py="