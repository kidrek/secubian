# =====================================================================
# ELK : Elasticsearch (la base) + Kibana (l'interface) + Logstash (l'aspirateur à logs)
# Le tout dans Docker.
# Accès : Kibana http://127.0.0.1:5601  /  Elasticsearch http://127.0.0.1:9200
#
# ATTENTION : opensearch.yml utilise AUSSI les ports 9200 et 5601.
# Lance l'un OU l'autre, pas les deux, sinon le 2e plantera.
# Et ça bouffe de la RAM (2 Go pour Elasticsearch + 2 Go pour Logstash) :
# prévois au moins 8 Go sur ta VM.
# =====================================================================

- name: "ELK | Choisir la version"
  ansible.builtin.set_fact:
    elk_version: "8.15.0"

# Elasticsearch a besoin de ce réglage du noyau Linux pour bien marcher
- name: "ELK | Réglage mémoire pour Elasticsearch (vm.max_map_count)"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-elasticsearch.conf
    content: "vm.max_map_count=262144\n"
    mode: "0644"
  register: elk_sysctl

- name: "ELK | Appliquer le réglage tout de suite"
  ansible.builtin.command: sysctl --system
  when: elk_sysctl.changed

- name: "ELK | Créer le réseau Docker"
  community.docker.docker_network:
    name: elastic

# Un volume pour garder les données. Avant y'avait "recreate: true" et pas de volume :
# à chaque lancement du playbook, tous tes index étaient effacés.
- name: "Elasticsearch | Créer le volume pour garder les données"
  community.docker.docker_volume:
    name: es_data

- name: "Elasticsearch | Lancer le conteneur"
  community.docker.docker_container:
    name: elasticsearch
    image: "docker.elastic.co/elasticsearch/elasticsearch:{{ elk_version }}"
    state: started
    env:
      node.name: "elasticsearch01"
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
      network.host: "0.0.0.0"          # à l'intérieur du conteneur, c'est normal
      bootstrap.memory_lock: "true"
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
    # "127.0.0.1:" = accessible seulement depuis ton PC. La sécurité est désactivée
    # (pas de mot de passe), donc surtout pas l'ouvrir au réseau.
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - name: elastic
    volumes:
      - "es_data:/usr/share/elasticsearch/data"
    # memlock : obligatoire avec bootstrap.memory_lock, sinon Elasticsearch râle
    ulimits:
      - "nofile:65536:65536"
      - "memlock:-1:-1"

- name: "Elasticsearch | Attendre que ça réponde"
  ansible.builtin.uri:
    url: http://127.0.0.1:9200/_cluster/health
    return_content: true
  register: es_health
  until: es_health.status == 200
  retries: 10
  delay: 60

# "green" = tout va bien. "yellow" c'est normal tant qu'il y a des réplicas (corrigé juste après)
- name: "Elasticsearch | Attendre le statut green ou yellow"
  ansible.builtin.uri:
    url: http://127.0.0.1:9200/_cluster/health
    return_content: true
  register: es_health
  until: es_health.json.status in ['green', 'yellow']
  retries: 10
  delay: 60

# Sur une seule machine, les "réplicas" (copies de secours) servent à rien et mettent
# le cluster en jaune. On les met à 0.
# Avant c'était un curl sans le header "Content-Type" : Elasticsearch refusait la requête.
# Et on peut pas changer le nombre de "shards" d'un index existant, donc on touche plus à ça.
- name: "Elasticsearch | Désactiver les réplicas"
  ansible.builtin.uri:
    url: "http://127.0.0.1:9200/_all/_settings?preserve_existing=false"
    method: PUT
    body_format: json
    body:
      index.number_of_replicas: "0"
    status_code: [200, 404]   # 404 = pas encore d'index, c'est pas grave

# ---------------------------------------------------------------------
# KIBANA
# ---------------------------------------------------------------------
# Cette clé sert à chiffrer des trucs dans Kibana. Elle est écrite en dur ici :
# si ton dépôt est public, change-la (32 caractères minimum).
- name: "Kibana | Lancer le conteneur"
  community.docker.docker_container:
    name: kibana
    image: "docker.elastic.co/kibana/kibana:{{ elk_version }}"
    state: started
    env:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      TELEMETRY_ENABLED: "false"     # pas de stats envoyées à Elastic
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: "d1a66dfd-c4d3-4a0a-8290-2abcb83ab3aa"
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - name: elastic

- name: "Kibana | Attendre que le port soit ouvert"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 5601
    timeout: 600

- name: "Kibana | Attendre que la licence soit active"
  ansible.builtin.uri:
    url: http://127.0.0.1:5601/api/licensing/info
    return_content: true
  register: kibana_license
  until: kibana_license.status == 200 and kibana_license.json.license.status == 'active'
  retries: 10
  delay: 60

# On importe tes tableaux de bord.
# Avant c'était une boucle shell avec "./files/..." : le dossier courant d'Ansible
# c'est pas forcément celui du playbook, donc il trouvait rien.
# "playbook_dir" = le dossier où est ton secubian.yml, là c'est sûr.
- name: "Kibana | Importer les tableaux de bord"
  ansible.builtin.uri:
    url: "http://127.0.0.1:5601/api/saved_objects/_import?overwrite=true"
    method: POST
    headers:
      kbn-xsrf: "true"
    body_format: form-multipart
    body:
      file:
        filename: "{{ item }}"
        mime_type: application/ndjson
  with_fileglob:
    - "{{ playbook_dir }}/files/kibana_dashboards/*.ndjson"

# Page d'accueil de Kibana = les tableaux de bord.
# On passe par l'API publique (/api/...) : l'API "internal" de Kibana 8 refuse
# les requêtes qui viennent pas du navigateur.
- name: "Kibana | Ouvrir sur les tableaux de bord par défaut"
  ansible.builtin.uri:
    url: http://127.0.0.1:5601/api/kibana/settings
    method: POST
    headers:
      kbn-xsrf: "true"
    body_format: json
    body:
      changes:
        defaultRoute: /app/dashboards

# ---------------------------------------------------------------------
# LOGSTASH : créé mais laissé éteint (tu le lances quand t'as des logs à ingérer)
# ---------------------------------------------------------------------
# Docker veut un chemin complet pour monter un dossier ("./files" ça marche pas)
- name: "Logstash | Créer le conteneur (éteint)"
  community.docker.docker_container:
    name: logstash
    image: "docker.elastic.co/logstash/logstash:{{ elk_version }}"
    state: stopped
    restart_policy: "no"
    env:
      LS_JAVA_OPTS: "-Xms2g -Xmx2g"
    networks:
      - name: elastic
    volumes:
      - "{{ playbook_dir }}/files/logstash/pipeline:/usr/share/logstash/pipeline/:ro"
