# =====================================================================
# VELOCIRAPTOR : pour collecter des traces et chasser les menaces sur
# plein de machines en même temps (via des agents).
# Accès : https://127.0.0.1:8889  (identifiant : secubian, mot de passe dans KeePassXC)
# =====================================================================

- name: "Velociraptor | Trouver l'architecture du PC"
  ansible.builtin.set_fact:
    deb_arch: "{{ arch | default('arm64' if ansible_architecture == 'aarch64' else 'amd64') }}"

- name: "Velociraptor | Chercher la dernière version sur GitHub"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/Velocidex/velociraptor/releases/latest"
    return_content: true
  register: velociraptor_release

- name: "Velociraptor | Afficher la version"
  ansible.builtin.debug:
    msg: "La dernière version de Velociraptor est : {{ velociraptor_release.json.tag_name }}"

# Avant on cherchait juste "linux-amd64" dans le nom : ça pouvait tomber sur
# "linux-amd64-musl" ou un fichier de signature ".sig". Le "$" = le nom doit FINIR par linux-amd64.
- name: "Velociraptor | Trouver le bon fichier à télécharger"
  ansible.builtin.set_fact:
    velociraptor_release_url: >-
      {{ velociraptor_release.json.assets
         | selectattr('name', 'search', '-linux-' ~ deb_arch ~ '$')
         | map(attribute='browser_download_url')
         | first }}

# "mode: 0755" = exécutable direct, plus besoin du chmod en shell
# (on reste dans /usr/bin : /usr/local/bin est utilisé par le paquet du serveur)
- name: "Velociraptor | Télécharger"
  ansible.builtin.get_url:
    url: "{{ velociraptor_release_url }}"
    dest: /usr/bin/velociraptor
    mode: "0755"
    force: true

# La config contient les clés de chiffrement du serveur.
# Avant elle était RE-générée à chaque lancement : tous les agents déjà installés
# sur les machines perdaient la connexion. "creates" = seulement la première fois.
- name: "Velociraptor | Générer la config (une seule fois)"
  ansible.builtin.shell: velociraptor config generate --no-interactive > /opt/server.config.yaml
  args:
    creates: /opt/server.config.yaml

- name: "Velociraptor | Protéger la config (elle contient des clés secrètes)"
  ansible.builtin.file:
    path: /opt/server.config.yaml
    mode: "0600"

# On fabrique le paquet .deb du serveur et on l'installe (ça crée le service).
# Une seule fois : quand /etc/velociraptor/server.config.yaml existe, c'est fait.
- name: "Velociraptor | Créer et installer le service"
  ansible.builtin.shell: >-
    velociraptor --config /opt/server.config.yaml debian server
    && dpkg -i velociraptor-server-*.deb
  args:
    chdir: /opt
    creates: /etc/velociraptor/server.config.yaml
  register: velociraptor_install

- name: "Velociraptor | Mot de passe"
  ansible.builtin.include_tasks: tasks/keepassXC_get_or_create_password.yml
  vars:
    keepass_entry: "velociraptor"
    keepass_url: "https://127.0.0.1:8889"
    keepass_username: "secubian"

# On crée le compte admin seulement à l'installation ou si le mot de passe vient d'être créé
- name: "Velociraptor | Créer le compte admin"
  ansible.builtin.command: >-
    sudo -u velociraptor velociraptor --config /etc/velociraptor/server.config.yaml
    user add secubian --role=administrator {{ password | quote }}
  when: velociraptor_install.changed or (keepass_entry_is_new | bool)
  no_log: true
