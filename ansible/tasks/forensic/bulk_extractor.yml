# =====================================================================
# BULK EXTRACTOR : fouille une image disque et sort tout ce qui traîne
# (mails, URLs, numéros de carte, etc.). On le compile nous-mêmes.
# =====================================================================

- name: "Bulk Extractor | Installer les outils pour compiler"
  ansible.builtin.apt:
    name:
      - autoconf
      - automake
      - flex
      - gcc
      - g++
      - git
      - libewf-dev
      - libjson-c-dev
      - libre2-dev
      - libssl-dev
      - libxml2-dev
      - libtool
      - make
      - pkg-config
      - zlib1g-dev
      - wget
    state: present

# Compiler c'est long : on le fait seulement si bulk_extractor est pas déjà installé.
# Pour forcer une recompilation : sudo rm /usr/local/bin/bulk_extractor
- name: "Bulk Extractor | Déjà installé ?"
  ansible.builtin.stat:
    path: /usr/local/bin/bulk_extractor
  register: bulk_extractor_bin

# Pas installé = on repart d'un dossier tout propre.
# Sinon il reste des morceaux d'une compilation ratée d'avant
# (erreur "undefined reference to scan_base16").
- name: "Bulk Extractor | Supprimer l'ancien dossier de compilation"
  ansible.builtin.file:
    path: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"
    state: absent
  when: not bulk_extractor_bin.stat.exists

# "recursive" = on prend aussi les sous-modules (sinon il manque des morceaux)
- name: "Bulk Extractor | Télécharger le code"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/simsong/bulk_extractor.git
    dest: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"
    recursive: true
    force: true

# On compile avec ton user, seule l'installation finale se fait en root
- name: "Bulk Extractor | Compiler"
  when: not bulk_extractor_bin.stat.exists
  block:
    - name: "Bulk Extractor | Préparer (bootstrap)"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: sh ./bootstrap.sh
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    - name: "Bulk Extractor | Configurer"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: ./configure
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    # -j = on utilise tous les cœurs du processeur, ça va plus vite
    - name: "Bulk Extractor | Compiler (make)"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: "make -j{{ ansible_facts['processor_vcpus'] | default(2) }}"
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    - name: "Bulk Extractor | Installer (make install)"
      ansible.builtin.command: make install
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"