# =====================================================================
# BULK EXTRACTOR : fouille une image disque et sort tout ce qui traîne
# (mails, URLs, numéros de carte, etc.). On le compile nous-mêmes.
# =====================================================================

- name: "Bulk Extractor | Installer les outils pour compiler"
  ansible.builtin.apt:
    name:
      - autoconf
      - automake
      - flex
      - gcc
      - g++
      - git
      - libewf-dev
      - libjson-c-dev
      - libre2-dev
      - libssl-dev
      - libxml2-dev
      - libtool
      - make
      - pkg-config     # ajouté : le "configure" s'en sert pour trouver les librairies
      - zlib1g-dev
      - wget
    state: present

# "recursive: true" : bulk_extractor a des sous-modules git (be20_api...).
# Sans ça, il manquait des morceaux et la compilation plantait.
- name: "Bulk Extractor | Télécharger le code"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/simsong/bulk_extractor.git
    dest: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"
    recursive: true
    force: true

# Avant il y avait ici une tâche qui commentait les "r.restart()" dans le code.
# C'était un bricolage pour une vieille version : maintenant le code fait
# "const auto restart = r.restart();" et s'en sert juste après. Le commenter
# cassait la compilation. Le code d'origine compile très bien tel quel.
# ("force: true" juste au-dessus remet le code d'origine si l'ancien bricolage est passé)

# Compiler ça prend du temps, donc on le fait seulement si bulk_extractor est pas déjà installé.
# Pour forcer une recompilation : sudo rm /usr/local/bin/bulk_extractor puis relance le playbook.
- name: "Bulk Extractor | Déjà installé ?"
  ansible.builtin.stat:
    path: /usr/local/bin/bulk_extractor
  register: bulk_extractor_bin

# Avant tout se faisait en "sudo" dans un shell : les fichiers de compilation
# appartenaient à root dans TON dossier. Là on compile avec ton user,
# et seule l'installation finale (make install) se fait en root.
- name: "Bulk Extractor | Compiler"
  when: not bulk_extractor_bin.stat.exists
  block:
    - name: "Bulk Extractor | Préparer (bootstrap)"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: sh ./bootstrap.sh
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    - name: "Bulk Extractor | Configurer"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: ./configure
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    # -j = on utilise tous les cœurs du processeur, ça va plus vite
    - name: "Bulk Extractor | Compiler (make)"
      become_user: "{{ ansible_user }}"
      ansible.builtin.command: "make -j{{ ansible_processor_vcpus | default(2) }}"
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"

    - name: "Bulk Extractor | Installer (make install)"
      ansible.builtin.command: make install
      args:
        chdir: "{{ DFIR_toolsDir }}/data_processing/bulk_extractor"