# =====================================================================
# KEEPASSXC : génère un mot de passe costaud (64 caractères)
# Il est rangé dans la variable "password" pour les tâches qui suivent
# =====================================================================

# -L 64 = 64 caractères, -l = minuscules, -U = majuscules, -n = chiffres
# "no_log" : le mot de passe s'affiche pas dans les logs
# "changed_when: false" : générer un mot de passe ça modifie rien sur le PC
- name: "Keepass | Générer un mot de passe"
  become_user: "{{ ansible_user }}"
  ansible.builtin.command: keepassxc-cli generate -L 64 -l -U -n
  delegate_to: localhost
  register: keepass_generated
  changed_when: false
  no_log: true

- name: "Keepass | Garder le mot de passe dans la variable 'password'"
  ansible.builtin.set_fact:
    password: "{{ keepass_generated.stdout }}"
  no_log: true
