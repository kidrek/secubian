# =====================================================================
# JUPYTER NOTEBOOK : les carnets d'analyse de Secubian
# Installe les modules Python, télécharge les notebooks et lance le service
# (pyenv.yml doit être passé avant)
# =====================================================================

- name: "Jupyter Notebook | Choisir la version de Python"
  ansible.builtin.set_fact:
    python_version: "3.9.18"
    jupyter_pip: "/home/{{ ansible_user }}/.pyenv/versions/3.9.18/bin/pip"
  tags: jupyter

# Avant on passait "$HOME" à Ansible, mais il le remplace pas toujours par ton vrai dossier.
# Là on donne directement le chemin complet du pip.
- name: "Jupyter Notebook | Installer les modules Python"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    name:
      - scipy
      - numpy
      - matplotlib
      - azure-mgmt-resource
      - msticpy
      - msticpy[azure]
      - pandas
      - poetry
    executable: "{{ jupyter_pip }}"
  tags: jupyter

- name: "Jupyter Notebook | Télécharger les notebooks Secubian"
  become_user: "{{ ansible_user }}"
  ansible.builtin.git:
    repo: https://github.com/kidrek/secubian-JupyterNotebook.git
    dest: "{{ playbooksDir }}/JupyterNotebook"
    accept_hostkey: true
    recursive: true
    force: true
  tags: jupyter

- name: "Jupyter Notebook | Installer les modules demandés par les notebooks"
  become_user: "{{ ansible_user }}"
  ansible.builtin.pip:
    requirements: "{{ playbooksDir }}/JupyterNotebook/requirements.txt"
    executable: "{{ jupyter_pip }}"
  tags: jupyter

# Raccourci pour mettre à jour les notebooks : tape "update-jupyter-notebook"
- name: "Jupyter Notebook | Ajouter l'alias de mise à jour"
  become_user: "{{ ansible_user }}"
  ansible.builtin.lineinfile:
    path: "/home/{{ ansible_user }}/.aliases"
    create: true
    mode: "0644"
    line: "alias update-jupyter-notebook='cd {{ playbooksDir }}/JupyterNotebook; git pull'"
    regexp: "^alias update-jupyter-notebook="
  tags: jupyter

- name: "Jupyter Notebook | Installer le service systemd"
  ansible.builtin.template:
    src: ../files/jupyter-notebook/jupyter-notebook.service
    dest: /etc/systemd/system/jupyter-notebook.service
    mode: "0644"
  tags: jupyter

# daemon_reload : systemd relit le fichier du service, sinon il voit pas les changements
- name: "Jupyter Notebook | Activer et démarrer le service"
  ansible.builtin.systemd_service:
    name: jupyter-notebook
    daemon_reload: true
    enabled: true
    state: started
  tags: jupyter
